name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$HOME/key.json"

      - name: Deploy hosting and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/key.json
        run: firebase deploy --only hosting,firestore:rules --project dial-748f1 --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/key.json"
